# 发布到 npm：推一个与 package.json 版本一致的 vX.Y.Z tag 即自动发布。
#
# 认证有两条路，任选其一即可；两条都配好时以 NPM_TOKEN 优先：
#
#   1. Trusted publishing（推荐，没有长期密钥）：把本仓库登记成该包的 trusted
#      publisher，之后 CI 用 OIDC 换一次性凭据发布，仓库里什么都不用存：
#
#        npm trust github @xia-sc/dsh-git --file publish.yml --repo xia-sc/dsh-git --allow-publish
#
#      （`npm trust` 需要 npm >= 11.5.1，是 2FA 操作；**而且要求包已经存在**——对不存在的包
#       服务端会回 E404 Package not found。所以首包必须先在本机交互式 `npm publish` 一次，
#       之后 tag 就全交给 CI。`--dry-run` 只在本地校验、不打服务端，别用它判断能否登记。）
#
#   2. Repository secret `NPM_TOKEN`：一个有发布权限的 granular access token。
#      classic token 已被 npm 吊销；npm 也在收紧"绕过 2FA 的 token 直接发布"，长期解是 OIDC。
#      没有这个 secret 时自动落到 OIDC。
#
# 这个包没有构建步骤（浏览器半就是手写产物，见 AGENTS.md §3.1）：CI 不装依赖、
# 不打包，只跑门禁再发布；`--access public` 由 package.json 的 publishConfig 决定。
# 跑在 ubuntu-latest 上：门禁是跨平台的（smoke 用 `join(tmpdir(), …)` 造绝对路径，
# 见 AGENTS.md §5）。`test/ui/*.mjs` 只能在 Windows 手动跑，但它们不在门禁里。
# 私有仓库发不出 provenance，那种情况请去掉 `--provenance`。
name: publish

on:
  push:
    tags: ["v*"]
  # 手动补发：tag 已存在但上一次发布失败时用；版本已在 registry 上会自动跳过。
  workflow_dispatch:

permissions:
  contents: read
  # OIDC：trusted publishing 与 provenance 都要它。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 自带 npm 11；trusted publishing 要求 npm >= 11.5.1。
          node-version: 24

      # 打错 tag 会发错版本，这里先拦住。
      # 注意：GitHub Actions 表达式只认单引号——写成 "refs/tags/" 会让整个 workflow
      # 文件被判非法（Invalid workflow file），运行根本不会启动。
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      # 唯一的门禁（AGENTS.md §2）。不需要 npm install：五个套件只用 node 内置模块，
      # 缺 profile / react 的三个（host-mount、slot-mount、render）会自己 SKIP。
      - name: Run the gate
        run: npm test

      # 这个版本已经在 registry 上就不发了（本机补发过一次，或者手动重跑 workflow），
      # 免得同一次 tag 撞 "cannot publish over existing version" 变成红灯。
      # 判据用「输出非空」而不是 npm 的退出码：`npm view pkg@不存在的版本` 在不同 npm 版本上
      # 行为不一致（本机 npm 12 报 E404 退出 1，CI 的 npm 11 曾经退出 0 且输出为空），
      # 按退出码判断会**静默跳过**本该执行的发布（0.5.2 第一次 tag 运行就是这么被吞掉的）。
      # 预检只是省一次上传：**它不可靠**。包刚发布过时 registry/CDN 的 packument 缓存会滞后几分钟，
      # 这里会看不到刚发出去的版本（0.5.2 的第二次运行就是如此，于是又发了同一版并撞 403）。
      # 真正的幂等由下面 Publish 步骤兜底：npm 报"版本已存在"就当作成功。
      - name: Check whether this version is already published
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          found="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=dsh-git publish::skipped — $name@$version looks like it is already on the registry"
          else
            echo "::notice title=dsh-git publish::attempting $name@$version (registry said it is unknown — may be cache lag)"
          fi

      - name: Publish
        if: steps.published.outputs.skip != '1'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> "$HOME/.npmrc"
            auth="NPM_TOKEN secret"
          else
            auth="trusted publishing (OIDC)"
          fi
          echo "::notice title=dsh-git publish::auth=$auth"
          # 同一个版本重复发布（重指 tag、手动重跑、预检被缓存骗了）不是失败：
          # 版本既然已经在那里，这一次运行的目标就已经达成。
          set +e
          output="$(npm publish --provenance 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && printf '%s' "$output" | grep -qi 'cannot publish over the previously published versions'; then
            echo "::notice title=dsh-git publish::nothing to do — this version is already on the registry"
            exit 0
          fi
          exit "$status"
